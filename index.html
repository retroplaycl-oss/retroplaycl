<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroPlayCL - Catálogo PKG PS3/PS4</title>
    <style>
        :root {
            --color-primary: #ff006e;
            --color-secondary: #00d9ff;
            --color-accent: #ffbe0b;
            --color-bg: #0a0e27;
            --color-surface: #1a1f3a;
            --color-text: #ffffff;
            --color-text-dark: #cccccc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px,
                transparent 1px, transparent 2px
            );
            z-index: 1;
        }
        header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            padding: 30px 20px; text-align: center;
            border-bottom: 5px solid var(--color-accent);
            box-shadow: 0 4px 10px rgba(255,0,110,0.5);
        }
        header h1 {
            font-size: 48px; text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            letter-spacing: 3px; animation: glow 2s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px var(--color-secondary); }
            50% { text-shadow: 0 0 20px var(--color-primary); }
        }
        .tagline { font-size: 14px; color: rgba(255,255,255,0.9); letter-spacing: 2px; }

        /* PESTAÑAS */
        .tabs {
            display: flex; justify-content: center; gap: 10px; padding: 20px;
            border-bottom: 3px solid var(--color-primary);
            background: var(--color-surface);
        }
        .tab-btn {
            padding: 10px 25px; border: 3px solid var(--color-primary);
            background: transparent; color: var(--color-text);
            font-family: 'Courier New', monospace; font-size: 14px;
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .tab-btn:hover { box-shadow: 0 0 15px var(--color-primary); }
        .tab-btn.active {
            background: var(--color-primary); color: white;
            box-shadow: 0 0 20px var(--color-primary); transform: scale(1.05);
        }

        /* NAV */
        nav {
            background: var(--color-surface); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--color-primary);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        .search-bar { flex: 1; margin: 0 20px; position: relative; }
        .search-bar input {
            width: 100%; padding: 10px 15px; border: 2px solid var(--color-accent);
            background: rgba(255,190,11,0.1); color: var(--color-text);
            font-family: 'Courier New', monospace; font-size: 14px;
        }
        .filters { display: flex; gap: 10px; align-items: center; }
        .filter-btn {
            padding: 8px 16px; border: 2px solid var(--color-secondary);
            background: transparent; color: var(--color-text);
            font-family: 'Courier New', monospace; font-size: 12px;
            cursor: pointer; transition: all 0.3s;
        }
        .filter-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
        .letter-filter {
            width: 150px; padding: 10px; border: 2px solid var(--color-accent);
            background: rgba(255,190,11,0.1); color: var(--color-text);
            font-family: 'Courier New', monospace; cursor: pointer;
        }

        /* CONTAINER */
        .container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
            position: relative; z-index: 2;
        }
        .stats-bar {
            display: flex; justify-content: space-between;
            padding: 15px; background: rgba(0,217,255,0.1);
            border: 2px dashed var(--color-secondary);
            margin-bottom: 20px; border-radius: 8px;
        }
        .stats-bar span { color: var(--color-accent); font-weight: bold; }

        /* GRID */
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .product-card {
            background: var(--color-surface); border: 3px solid var(--color-primary);
            padding: 15px; cursor: pointer; transition: all 0.3s;
            box-shadow: 5px 5px 0 var(--color-secondary);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px); box-shadow: 8px 8px 0 var(--color-accent);
            border-color: var(--color-secondary);
        }
        .region-badge {
            position: absolute; top: 8px; right: 8px;
            padding: 3px 8px; font-size: 10px; font-weight: bold;
            border-radius: 4px; z-index: 5;
        }
        .region-badge.eu { background: #ff006e; color: white; }
        .region-badge.us { background: #00d9ff; color: #000; }
        .product-image {
            width: 100%; height: 100px;
            background: linear-gradient(135deg, rgba(255,0,110,0.15), rgba(0,217,255,0.15));
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; margin-bottom: 10px;
            border: 2px dashed var(--color-accent); border-radius: 4px;
        }
        .product-name {
            font-weight: bold; font-size: 13px; margin-bottom: 6px;
            color: var(--color-accent); min-height: 36px;
        }
        .product-code {
            font-size: 11px; color: var(--color-text-dark);
            margin-bottom: 6px; font-family: monospace;
        }
        .product-type {
            font-size: 11px; color: var(--color-secondary);
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .card-buttons { display: flex; gap: 6px; }
        .btn-pkg {
            flex: 1; padding: 8px; font-size: 12px;
            background: var(--color-primary); border: none;
            color: white; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .btn-pkg:hover { background: var(--color-secondary); color: #000; }
        .btn-copy {
            padding: 8px 12px; font-size: 12px;
            background: rgba(255,190,11,0.2); border: 2px solid var(--color-accent);
            color: var(--color-accent); font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .btn-copy:hover { background: var(--color-accent); color: #000; }

        /* NUMBER SELECTOR */
        .page-controls {
            display: flex; justify-content: center; align-items: center;
            gap: 15px; padding: 20px; border-top: 3px solid var(--color-primary);
            background: var(--color-surface); margin-top: 20px;
        }
        .page-controls select, .page-controls input {
            padding: 8px; border: 2px solid var(--color-secondary);
            background: rgba(0,0,0,0.3); color: var(--color-text);
            font-family: 'Courier New', monospace;
        }
        .page-controls button {
            padding: 8px 16px; background: var(--color-primary);
            border: none; color: white; font-weight: bold;
            cursor: pointer; font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .page-controls button:hover { background: var(--color-secondary); color: #000; }

        /* FOOTER */
        .footer {
            background: var(--color-surface); padding: 20px;
            text-align: center; border-top: 3px solid var(--color-primary);
            margin-top: 40px; color: var(--color-text-dark);
        }
        .footer a { color: var(--color-secondary); text-decoration: none; }
        .footer a:hover { color: var(--color-accent); }

        .hidden { display: none; }

        @media (max-width: 768px) {
            header h1 { font-size: 28px; }
            nav { flex-direction: column; gap: 15px; }
            .nav-left { flex-direction: column; width: 100%; }
            .search-bar { width: 100%; margin: 0; }
            .filters { flex-wrap: wrap; justify-content: center; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .stats-bar { flex-direction: column; gap: 8px; text-align: center; }
            .tab-btn { padding: 8px 20px; font-size: 12px; }
        }
    </style>
</head>
