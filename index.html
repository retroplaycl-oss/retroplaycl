<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroPlayCL - Catálogo de Juegos Retro</title>

    <style>
        :root {
            --color-primary: #ff006e;
            --color-secondary: #00d9ff;
            --color-accent: #ffbe0b;
            --color-bg: #0a0e27;
            --color-surface: #1a1f3a;
            --color-surface-alt: #131631;
            --color-text: #ffffff;
            --color-text-muted: #cccccc;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.6);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #1a1f3a 0, #050618 45%, #000000 100%);
            color: var(--color-text);
            min-height: 100vh;
        }

        .scanlines {
            pointer-events: none;
            position: fixed;
            inset: 0;
            background-image: linear-gradient(
                rgba(0, 0, 0, 0.25) 1px,
                transparent 1px
            );
            background-size: 100% 2px;
            mix-blend-mode: soft-light;
            opacity: 0.35;
            z-index: 50;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px 40px;
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: radial-gradient(circle at 30% 20%, #ffffff 0, #ffbe0b 20%, #ff006e 60%, #0a0e27 100%);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.15), var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }

        .brand-logo::before {
            content: "";
            position: absolute;
            inset: 9px 7px;
            border-radius: 6px;
            border: 2px solid rgba(0,0,0,0.35);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }

        .brand-text h1 {
            font-size: 1.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .brand-text h1 span {
            background: linear-gradient(90deg, #ff006e, #ffbe0b);
            -webkit-background-clip: text;
            color: transparent;
        }

        .brand-text p {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.19);
            background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            backdrop-filter: blur(18px);
            padding: 7px 14px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--color-text-muted);
        }

        .pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d9ff, #0a0e27);
            box-shadow: 0 0 0 3px rgba(0,217,255,0.25);
        }

        .pill-primary {
            border-color: rgba(255,0,110,0.5);
            color: #ff9ac2;
        }

        .pill-primary .pill-dot {
            background: radial-gradient(circle, #ff006e, #0a0e27);
            box-shadow: 0 0 0 3px rgba(255,0,110,0.35);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr);
            gap: 24px;
        }
